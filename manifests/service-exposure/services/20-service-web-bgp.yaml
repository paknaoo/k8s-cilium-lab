apiVersion: v1
kind: Service
metadata:
  annotations:
    lbipam.cilium.io/ips: 10.30.0.100
  labels:
    bgp-advertise: 'true'
    lb-ipam: bgp
  name: web-bgp
  namespace: lb-ipam-demo
spec:
  allocateLoadBalancerNodePorts: true
  externalTrafficPolicy: Cluster
  internalTrafficPolicy: Cluster
  loadBalancerClass: io.cilium/bgp-control-plane
  ports:
  - name: http
    nodePort: 32382
    port: 80
    protocol: TCP
    targetPort: 80
  selector:
    app: lb-ipam-web
  sessionAffinity: None
  type: LoadBalancer
